<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · AI Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   AI Expense Tracker: sign in / sign up
   One white rounded frame on the pale page. Left: the form. Right: an inset blue panel
   with three slides of stacked cards, a brand tile, a headline and progress bars.
   ========================================================================== */
:root {
  --bg: #ECF1F9;
  --card: #FFFFFF;
  --ink: #0D1B33;
  --ink-2: #3F4F6B;
  --ink-3: #5C6C87;          /* secondary text, 5.3:1 on white */
  --line: #E3E9F3;
  --field-line: #D5DEEE;
  --wash: #F4F7FC;
  --blue: #0A47E6;
  --tint: #E7EFFE;
  --good: #0B7F4A;  --good-bg: #E3F6EC;
  --bad:  #C8283A;  --bad-bg:  #FDEBEE;  --bad-line: #E5484D;
  --warn: #8A5200;  --warn-bg: #FFF2D6;
  --shadow: 0 1px 2px rgba(18,38,84,.04), 0 10px 30px rgba(18,38,84,.06);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --slide-ms: 6500ms;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); }
h1, h2, p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
.ico { flex: none; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid rgba(10,71,230,.45); outline-offset: 2px; border-radius: 10px; }
svg text { font-family: var(--font); }

/* ---------- Frame ---------- */
.shell { min-height: 100vh; padding: 16px; }
.frame {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 14px;
  background: var(--card); border-radius: 32px; box-shadow: var(--shadow);
  height: calc(100vh - 32px); min-height: 660px;
}
.brand { display: inline-flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; color: var(--ink); }
.brand:hover { text-decoration: none; }

/* ---------- Left: form ---------- */
.left { display: flex; flex-direction: column; padding: 14px 34px 6px 30px; min-width: 0; }
.form-wrap { width: 100%; max-width: 396px; margin: clamp(20px, 7vh, 80px) auto 0; }
.form-head { text-align: center; }
h1 { font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.035em; }
.lede { margin-top: 8px; font-size: 15px; color: var(--ink-3); }

.seg { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; background: var(--wash); border-radius: 999px; padding: 4px; }
.seg button { height: 42px; border: 0; border-radius: 999px; background: transparent; font-weight: 600; font-size: 14.5px; color: var(--ink-3); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(18,38,84,.12); }

form { margin-top: 22px; display: grid; gap: 16px; }
.fld { display: grid; gap: 7px; }
.fld > label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.ctl { position: relative; display: flex; align-items: center; }
.ctl .lead-ico { position: absolute; left: 16px; color: var(--ink-3); pointer-events: none; }
.ctl input {
  width: 100%; height: 52px; border-radius: 16px; border: 1px solid var(--field-line); background: #fff;
  padding: 0 16px 0 46px; font-size: 15px; font-weight: 500; color: var(--ink); box-shadow: 0 1px 2px rgba(18,38,84,.04);
  transition: border-color .15s, box-shadow .15s;
}
.ctl input.has-eye { padding-right: 52px; }
.ctl input::placeholder { color: var(--ink-3); font-weight: 400; }
.ctl input:hover { border-color: #BFCCE4; }
.ctl input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(10,71,230,.14); }
.ctl input[aria-invalid="true"] { border-color: var(--bad-line); }
.ctl input[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px rgba(229,72,77,.16); }
.eye { position: absolute; right: 7px; width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-3); display: grid; place-items: center; }
.eye:hover { background: var(--wash); color: var(--ink); }
.err { display: flex; align-items: center; gap: 6px; color: var(--bad); font-size: 13px; font-weight: 500; }
.hint { font-size: 12.5px; color: var(--ink-3); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--blue); }
.link { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 600; font-size: 13.5px; }
.link:hover { text-decoration: underline; }

.banner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 500; line-height: 1.45; }
.banner .ico { margin-top: 1px; }
.banner.err { background: var(--bad-bg); color: var(--bad); }
.banner.info { background: var(--tint); color: var(--ink-2); }
.banner.info .ico { color: var(--blue); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  height: 52px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; white-space: nowrap; transition: transform .08s, box-shadow .15s, background .15s;
}
.btn:hover { text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn-primary { color: #fff; background: linear-gradient(180deg, #1A74FF, #0A47E6); box-shadow: 0 8px 20px rgba(10,71,230,.30); }
.btn-primary:hover { box-shadow: 0 10px 24px rgba(10,71,230,.40); }
.btn-secondary { background: #fff; border-color: var(--field-line); box-shadow: 0 1px 2px rgba(18,38,84,.05); }
.btn-secondary:hover { background: var(--wash); }
.btn[disabled] { cursor: progress; }
.btn-primary[disabled] { opacity: .8; box-shadow: none; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .9s linear infinite; }
.or { display: flex; align-items: center; gap: 14px; color: var(--ink-3); font-size: 13px; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--field-line); }

.fine { margin-top: auto; padding-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-size: 12.5px; color: var(--ink-3); }
.fine .ico { margin-top: 0; }

.done { text-align: center; display: grid; justify-items: center; }
.done-ico { width: 68px; height: 68px; border-radius: 50%; background: var(--good-bg); color: var(--good); display: grid; place-items: center; }
.done h1 { margin-top: 22px; }
.done .btn { margin-top: 30px; }
.done .again { margin-top: 18px; }

/* ---------- Right: carousel panel ---------- */
.right {
  position: relative; overflow: hidden; color: #fff; border-radius: 24px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; text-align: center; padding: 22px 30px 26px;
  background: linear-gradient(155deg, #0733C2 0%, #0A4FE2 40%, #0A7BF0 76%, #08B2F8 100%);
}
.right::before {            /* fine grid, fades out downward */
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 44px 44px; background-position: center top;
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 0%, transparent 78%); mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 0%, transparent 78%);
}
.right::after {             /* soft glow */
  content: ''; position: absolute; left: 50%; top: -180px; width: 640px; height: 520px; margin-left: -320px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.20), transparent 68%);
}
.right > * { position: relative; z-index: 1; }

.viz { position: relative; flex: 1; min-height: 0; width: 100%; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s; }
.slide.on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.cards { position: absolute; left: 50%; top: 50%; width: 560px; height: 350px; margin: -175px 0 0 -280px; transform: scale(var(--s, 1)); transform-origin: center; text-align: left; }

.tile { margin-top: 14px; width: 56px; height: 56px; border-radius: 18px; background: #fff; display: grid; place-items: center; box-shadow: 0 14px 30px rgba(4,24,90,.30); }
.caps { margin-top: 22px; width: 100%; max-width: 540px; display: grid; }
.cap { grid-area: 1 / 1; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s linear .5s; }
.cap.on { opacity: 1; visibility: visible; transition-delay: 0s; }
.cap h2 { font-size: clamp(30px, 2.7vw, 42px); line-height: 1.12; font-weight: 700; letter-spacing: -0.035em; text-wrap: balance; }
.cap p { margin: 14px auto 0; max-width: 470px; font-size: clamp(14.5px, 1.1vw, 16.5px); line-height: 1.55; color: rgba(255,255,255,.94); text-wrap: balance; }

.dots { margin-top: 26px; display: flex; gap: 10px; }
.dot { position: relative; width: 64px; height: 20px; padding: 0; border: 0; background: none; }
.dot::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.32); }
.dot i { position: absolute; left: 0; top: 8px; height: 5px; width: 0; border-radius: 3px; background: #fff; }
.dot.done i { width: 100%; }
.dot.on i { animation: fill var(--slide-ms) linear forwards; }
.right:hover .dot.on i, .right:focus-within .dot.on i { animation-play-state: paused; }
.dot:focus-visible { outline-color: #fff; }
@keyframes fill { from { width: 0; } to { width: 100%; } }

/* ---------- Cards inside the slides (design size 560 x 350, scaled) ---------- */
.c {
  position: absolute; background: #fff; color: var(--ink); border-radius: 20px; padding: 16px 18px; font-size: 12px; line-height: 1.4;
  box-shadow: 0 24px 48px rgba(4,24,90,.32), 0 0 0 1px rgba(255,255,255,.55);
}
.c.neg { background: linear-gradient(180deg, #FFF1F3 0%, #fff 70%); }
.c-head { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.c-badge { width: 26px; height: 26px; border-radius: 50%; background: #0D1220; color: #fff; display: grid; place-items: center; flex: none; }
.c-badge.ai { background: var(--tint); color: var(--blue); }
.c-big { margin-top: 10px; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.035em; white-space: nowrap; }
.c-big small { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.c-big.bad { color: var(--bad); }
.c-row { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.c-row .c-big { margin-top: 0; }
.c-note { margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
.delta { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta-bad  { color: var(--bad);  background: var(--bad-bg); }
.delta-good { color: var(--good); background: var(--good-bg); }
.save { margin-left: auto; display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--good); background: var(--good-bg); white-space: nowrap; }
.legend { display: grid; gap: 6px; flex: 1; min-width: 0; }
.legend div { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.legend span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { margin-top: 12px; height: 34px; display: flex; align-items: flex-end; gap: 6px; }
.bars i { flex: 1; border-radius: 6px 6px 3px 3px; background: #CFDDFB; }
.bars i.now { background: linear-gradient(180deg, #1A74FF, #0A3FD6); }
.catic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.aibox { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--tint); display: grid; gap: 7px; }
.aibox p { display: flex; gap: 7px; font-size: 11.5px; line-height: 1.4; color: var(--ink-2); }
.aibox p .ico { color: var(--blue); margin-top: 1px; }
.aibox p.act { color: var(--ink); font-weight: 600; }
.clamp2, .clamp3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp2 { -webkit-line-clamp: 2; } .clamp3 { -webkit-line-clamp: 3; }
.aibox p > span:last-child { min-width: 0; }
.status { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.status-over { color: var(--bad);  background: var(--bad-bg); }
.status-near { color: var(--warn); background: var(--warn-bg); }
.status-ok   { color: var(--good); background: var(--good-bg); }
.brow { display: grid; gap: 7px; }
.brow + .brow { margin-top: 12px; }
.brow-top { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; }
.brow-top .pct { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.track { height: 6px; border-radius: 3px; background: #E9EEF7; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; }
.trow { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; }
.trow + .trow { margin-top: 10px; }
.trow .amt { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: var(--wash); color: var(--ink-2); }
.chip.ai { background: var(--tint); color: var(--blue); }

@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .spinner { animation-duration: 2.4s; }
  .dot.on i { animation: none; width: 100%; }
}

/* ---------- Short desktop screens ---------- */
@media (max-height: 780px) {
  .cap p { display: none; }
  .tile { margin-top: 8px; width: 48px; height: 48px; border-radius: 16px; }
  .caps { margin-top: 16px; }
  .dots { margin-top: 18px; }
  .form-wrap { margin-top: 14px; }
  h1 { font-size: 28px; }
  .seg { margin-top: 18px; } form { margin-top: 16px; gap: 14px; }
}
/* ---------- Narrower desktop ---------- */
@media (max-width: 1180px) {
  .left { padding-left: 20px; padding-right: 22px; }
  .right { padding-left: 28px; padding-right: 28px; }
}
/* ---------- Tablet and phone: form only ---------- */
@media (max-width: 960px) {
  .shell { padding: 0; }
  .frame { grid-template-columns: minmax(0, 1fr); border-radius: 0; box-shadow: none; padding: 0; height: auto; min-height: 100vh; }
  .right { display: none; }
  .left { padding: 18px 20px 24px; max-width: 520px; width: 100%; margin: 0 auto; }
  .form-wrap { margin-top: 28px; }
}
@media (max-width: 380px) { .row { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="shell">
 <div class="frame">

  <!-- ================= Left: form ================= -->
  <main class="left">
    <a class="brand" href="#" aria-label="AI Expense Tracker">
      <!-- Original mark: three rising bars on a blue-to-cyan tile -->
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="mark-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0733C2"/><stop offset="1" stop-color="#08B2F8"/></linearGradient></defs>
        <rect width="40" height="40" rx="12" fill="url(#mark-g)"/>
        <rect x="9" y="22" width="5" height="9" rx="2.5" fill="#fff" fill-opacity=".65"/>
        <rect x="17.5" y="15.5" width="5" height="15.5" rx="2.5" fill="#fff" fill-opacity=".85"/>
        <rect x="26" y="9" width="5" height="22" rx="2.5" fill="#fff"/>
      </svg>
      <span class="brand-name">AI Expense Tracker</span>
    </a>

    <section class="form-wrap" aria-labelledby="title">
      <div id="form-view">
        <div class="form-head">
          <h1 id="title">Welcome back</h1>
          <p class="lede" id="lede">Sign in to see your spending, budgets and AI advice.</p>
        </div>

        <div class="seg" role="group" aria-label="Sign in or sign up">
          <button type="button" id="seg-in" aria-pressed="true">Sign in</button>
          <button type="button" id="seg-up" aria-pressed="false">Sign up</button>
        </div>

        <form id="form" novalidate>
          <div id="banner" class="banner" role="alert" hidden></div>

          <div class="fld" id="f-name" hidden>
            <label for="name">Full name</label>
            <div class="ctl">
              <span class="lead-ico" data-i="user" data-s="20"></span>
              <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" aria-describedby="e-name">
            </div>
            <div class="err" id="e-name" hidden></div>
          </div>

          <div class="fld" id="f-email">
            <label for="email">Email</label>
            <div class="ctl">
              <span class="lead-ico" data-i="mail" data-s="20"></span>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" aria-describedby="e-email">
            </div>
            <div class="err" id="e-email" hidden></div>
          </div>

          <div class="fld" id="f-pw">
            <label for="password">Password</label>
            <div class="ctl">
              <span class="lead-ico" data-i="lock" data-s="20"></span>
              <input id="password" name="password" type="password" class="has-eye" autocomplete="current-password" placeholder="Your password" aria-describedby="e-pw hint-pw">
              <button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <div class="err" id="e-pw" hidden></div>
            <p class="hint" id="hint-pw" hidden>Use at least 8 characters.</p>
          </div>

          <div class="row" id="row-remember">
            <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in</label>
            <button class="link" id="forgot" type="button">Forgot password?</button>
          </div>

          <button class="btn btn-primary" id="submit" type="submit"><span id="submit-label">Sign in</span></button>
          <div class="or" id="or">Or try it first</div>
          <button class="btn btn-secondary" id="demo" type="button"><span data-i="user" data-s="18"></span>Use demo account</button>
        </form>
      </div>

      <div class="done" id="done-view" hidden>
        <div class="done-ico" data-i="check" data-s="32"></div>
        <h1 id="done-title" tabindex="-1">You're signed in</h1>
        <p class="lede" id="done-text"></p>
        <a class="btn btn-primary" id="open-app" href="/#overview">Open dashboard</a>
        <p class="again"><button class="link" id="back" type="button">Use a different account</button></p>
      </div>
    </section>

    <p class="fine"><span data-i="shield" data-s="16"></span><span>Long digit runs and UPI IDs are masked before anything is sent to the AI.</span></p>
  </main>

  <!-- ================= Right: carousel ================= -->
  <aside class="right" id="right" role="region" aria-roledescription="carousel" aria-label="What AI Expense Tracker does">
    <div class="viz" id="viz" aria-hidden="true"></div>
    <div class="tile" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 40 40">
        <rect x="6" y="22" width="7" height="12" rx="3.5" fill="#0A47E6" fill-opacity=".45"/>
        <rect x="16.5" y="14" width="7" height="20" rx="3.5" fill="#0A47E6" fill-opacity=".72"/>
        <rect x="27" y="5" width="7" height="29" rx="3.5" fill="#0A47E6"/>
      </svg>
    </div>
    <div class="caps" id="caps" aria-live="off"></div>
    <div class="dots" id="dots" role="group" aria-label="Choose a slide"></div>
  </aside>

 </div>
</div>

<script>
/* ==========================================================================
   Settings and sample data. `api` below calls the FastAPI backend:
     POST /auth/login   { email, password, remember }
     POST /auth/signup  { name, email, password, remember }
   ========================================================================== */
const BRAND = 'AI Expense Tracker';

const AUTH = {
  appUrl: '/#overview',                         // where "Open dashboard" goes
  autoRedirect: false,                          // true: go to the dashboard right after sign in
  redirectDelayMs: 1400,
  slideMs: 6500                                 // time each slide stays up
};

// The same sample figures the dashboard uses (October 2026). Used only for the cards on the right.
const SAMPLE = {
  spending: [39808, 43990, 42368, 48477, 50126, 63183],       // May to October
  left_over: { sep: 10874, oct: -1683 },
  savings_rate: { sep: 22.9, oct: 2.8 },
  categories: [
    { name: 'Rent & Housing', amount: 18000 }, { name: 'Food & Dining', amount: 14245 }, { name: 'Shopping', amount: 13491 },
    { name: 'Groceries', amount: 4168 }, { name: 'Transport', amount: 3765 }, { name: '5 more', amount: 9514 }
  ],
  monthly_saving: 9515.66,
  cut_count: 5,
  cuts: [
    { merchant: 'AMAZON PAY', category: 'Shopping', saving: 2905.33,

// POST JSON. A failure becomes { code } for messageFor(): 401 invalid, 409 exists, anything else network.
async function post(path, body) {
  let response;
  try {
    response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    throw { code: 'network' };
  }
  if (response.ok) return response.json();
  throw { code: response.status === 401 ? 'invalid' : response.status === 409 ? 'exists' : 'network' };
}

const api = {
  login: ({ email, password }) => post('/auth/login', { email, password, remember: $('remember').checked }),
  register: ({ name, email, password }) => post('/auth/signup', { name, email, password }),

    await wait(300);
    return {};
  }
};

function svg(name, size = 20) {
  const fill = name === 'sparkle' ? 'currentColor' : 'none';
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;
}
function paintIcons(root = document) {
  root.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = svg(el.dataset.i, +el.dataset.s || 20); });

/* ---------- Page state ---------- */
const ui = { mode: 'signin', busy: false, showPw: false, slide: 0 };

const COPY = {

/* ---------- Errors ---------- */
function showFieldError(field, msg) {
  const input = $(field), box = $('e-' + (field === 'password' ? 'pw' : field));
  input.setAttribute('aria-invalid', 'true');
  box.innerHTML = svg('alert', 16) + '<span></span>';
  box.lastChild.textContent = msg;
  box.hidden = false;
}
function clearFieldError(field) {
  $(field).removeAttribute('aria-invalid');
  const box = $('e-' + (field === 'password' ? 'pw' : field));
  box.hidden = true; box.innerHTML = '';
}
function clearErrors() {
  ['name', 'email', 'password'].forEach(clearFieldError);
  hideBanner();
}
function showBanner(kind, msg) {
  const b = $('banner');
  b.className = 'banner ' + kind;
  b.innerHTML = svg(kind === 'err' ? 'alert' : 'info', 18) + '<span></span>';
  b.lastChild.textContent = msg;
  b.hidden = false;
}
function hideBanner() { $('banner').hidden = true; }

/* ---------- Validation ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validate() {
  const v = { name: $('name').value.trim(), email: $('email').value.trim(), password: $('password').value };
  const bad = [];
  if (ui.mode === 'signup' && !v.name) bad.push(['name', 'Enter your name.']);
  if (!v.email) bad.push(['email', 'Enter your email.']);
  else if (!EMAIL_RE.test(v.email)) bad.push(['email', 'Enter a valid email, like you@example.com.']);
  if (!v.password) bad.push(['password', 'Enter your password.']);
  else if (ui.mode === 'signup' && v.password.length < 8) bad.push(['password', 'Use at least 8 characters.']);
  return { v, bad };
}

/* ---------- Submit ---------- */
function setBusy(on) {
  ui.busy = on;
  const btn = $('submit');
  btn.disabled = on; $('demo').disabled = on;
  btn.setAttribute('aria-busy', on ? 'true' : 'false');
  $('submit-label').textContent = on ? (ui.mode === 'signup' ? 'Creating account…' : 'Signing in…') : COPY[ui.mode].submit;
  const old = btn.querySelector('.spinner'); if (old) old.remove();
  if (on) { const s = document.createElement('span'); s.className = 'spinner'; btn.prepend(s); }
}

function messageFor(err) {
  if (err && err.code === 'invalid') return 'Email or password is incorrect. Check them and try again.';
  if (err && err.code === 'exists')  return 'An account with this email already exists. Sign in instead.';
  return "We couldn't reach the server. Check your connection and try again.";
}

async function submit() {
  if (ui.busy) return;
  clearErrors();
  const { v, bad } = validate();
  if (bad.length) {
    bad.forEach(([f, m]) => showFieldError(f, m));
    $(bad[0][0]).focus();
    return;
  }
  setBusy(true);
  try {
    const user = ui.mode === 'signup' ? await api.register(v) : await api.login(v);
    showDone(user);
  } catch (err) {
    showBanner('err', messageFor(err));
  } finally {
    setBusy(false);
  }
}

function showDone(user) {
  $('form-view').hidden = true;
  $('done-view').hidden = false;
  $('done-title').textContent = ui.mode === 'signup' ? 'Account created' : "You're signed in";
  $('done-text').textContent = (ui.mode === 'signup' ? 'Welcome' : 'Signed in as') + ' ' + (user.name || user.email) + '. Your dashboard is ready.';
  $('open-app').href = AUTH.appUrl;
  $('done-title').focus();
  if (AUTH.autoRedirect) setTimeout(() => { location.href = AUTH.appUrl; }, AUTH.redirectDelayMs);
}

/* ==========================================================================
   Right panel: three slides of stacked cards (sample figures only)
   ========================================================================== */
const pos = (l, t, w, z = 1) => `style="left:${l}px;top:${t}px;width:${w}px;z-index:${z}"`;
const catIcon = cat => { const c = CAT[cat] || CAT['Shopping']; return `<span class="catic" style="background:color-mix(in srgb, ${c.hue} 14%, white);color:${c.hue}">${svg(c.icon, 14)}</span>`; };
const badge = (name, ai) => `<span class="c-badge${ai ? ' ai' : ''}">${svg(name, 14)}</span>`;

function donut() {
  const C = SAMPLE.categories, total = C.reduce((a, b) => a + b.amount, 0), r = 36, circ = 2 * Math.PI * r, gap = 4;
  let acc = 0;
  const arcs = C.map((c, i) => {
    const share = circ * c.amount / total, len = Math.max(share - gap, 1), off = -acc;
    acc += share;
    return `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${DONUT_COLORS[i]}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${(circ - len).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 50 50)"/>`;
  }).join('');
  return `<svg width="104" height="104" viewBox="0 0 100 100" aria-hidden="true">${arcs}
    <text x="50" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#0D1B33">${inr(total)}</text>
    <text x="50" y="62" text-anchor="middle" font-size="8" fill="#5C6C87">in October</text></svg>`;
}

function slideOverview() {
  const sp = SAMPLE.spending, last = sp[5], prev = sp[4], max = Math.max(...sp);
  const pct = ((last - prev) / prev * 100).toFixed(1);
  const lo = SAMPLE.left_over;
  const legend = SAMPLE.categories.slice(0, 3).map((c, i) => `<div><i style="background:${DONUT_COLORS[i]}"></i><span>${esc(c.name)}</span><b>${inr(c.amount)}</b></div>`).join('');
  const bars = sp.map((n, i) => `<i class="${i === 5 ? 'now' : ''}" style="height:${Math.round(n / max * 100)}%"></i>`).join('');
  return `
    <div class="c" ${pos(130, 0, 300, 1)}>
      <div class="c-head">${badge('pie')}Spending Breakdown</div>
      <div class="c-row" style="margin-top:12px;gap:16px">${donut()}<div class="legend">${legend}</div></div>
    </div>
    <div class="c" ${pos(0, 160, 250, 2)}>
      <div class="c-head">${badge('outflow')}Spending</div>
      <div class="c-row"><span class="c-big">${inr(last)}</span><span class="delta delta-bad">${svg('up', 11)}+${pct}%</span></div>
      <div class="bars">${bars}</div>
      <p class="c-note" style="margin-top:8px">Up ${inr(last - prev)} from September.</p>
    </div>
    <div class="c neg" ${pos(290, 192, 270, 2)}>
      <div class="c-head">${badge('wallet')}Left over</div>
      <div class="c-row"><span class="c-big bad">${inr(lo.oct)}</span><span class="delta delta-bad">${svg('down', 11)}${inr(lo.oct - lo.sep)}</span></div>
      <p class="c-note">Was ${inr(lo.sep)} in September.</p>
    </div>`;
}

function slideCuts() {
  const [a, b] = SAMPLE.cuts;
  return `
    <div class="c" ${pos(100, 0, 360, 1)}>
      <div class="c-head">${catIcon(a.category)}${esc(titleCase(a.merchant))}<span class="save">Save ${inr(a.saving)} a month</span></div>

const STATUS = { over: ['alert', 'Over'], near: ['clock', 'Near'], ok: ['check', 'OK'] };
const BAR = { over: '#E5484D', near: '#F2A413', ok: '#19B37A' };

function slideBudgets() {
  const rows = SAMPLE.budgets.map(b => {
    const pct = b.spent / b.limit * 100, [ic, label] = STATUS[b.status];
    return `<div class="brow"><div class="brow-top">${catIcon(b.category)}${esc(b.category)}<span class="pct">${Math.round(pct)}% used</span><span class="status status-${b.status}">${svg(ic, 12)}${label}</span></div>
      <div class="track"><i style="width:${Math.min(pct, 100).toFixed(1)}%;background:${BAR[b.status]}"></i></div></div>`;
  }).join('');
  const tx = SAMPLE.transactions.map(t => `<div class="trow">${catIcon(t.category)}<span>${esc(titleCase(t.merchant))}</span>
      ${t.by === 'ai' ? `<span class="chip ai">${svg('sparkle', 10)}AI</span>` : `<span class="chip">You</span>`}<span class="amt">-${inr(t.amount)}</span></div>`).join('');
  const sr = SAMPLE.savings_rate;
  return `
    <div class="c" ${pos(0, 0, 350, 1)}>
      <div class="c-head" style="margin-bottom:14px">${badge('target')}Budgets</div>${rows}

    </div>

      <p class="c-big bad">${sr.oct}%</p>
      <p class="c-note">Down from ${sr.sep}% in September.</p>
    </div>`;
}

const SLIDES = [
  { title: 'Know where every rupee goes.', text: 'Upload a bank or UPI statement. AI sorts every transaction into clear categories and shows your month at a glance.', html: slideOverview },
  { title: 'See exactly where to cut.', text: 'AI reads your own history and suggests specific, realistic cuts, each one shown beside the real statement rows behind it.', html: slideCuts },
  { title: 'Budgets that say it in words.', text: 'Every limit reads Over, Near or OK, and every transaction shows whether the AI or you chose its category.', html: slideBudgets }
];

/* ---------- Carousel ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildCarousel() {
  $('viz').innerHTML = SLIDES.map((s, i) => `<div class="slide" data-i="${i}"><div class="cards">${s.html()}</div></div>`).join('');
  $('caps').innerHTML = SLIDES.map((s, i) => `<div class="cap" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${SLIDES.length}"><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p></div>`).join('');
  $('dots').innerHTML = SLIDES.map((s, i) => `<button class="dot" type="button" aria-label="Show slide ${i + 1} of ${SLIDES.length}: ${esc(s.title)}"><i></i></button>`).join('');
  document.documentElement.style.setProperty('--slide-ms', AUTH.slideMs + 'ms');
}

function goTo(i) {
  ui.slide = (i + SLIDES.length) % SLIDES.length;
  document.querySelectorAll('.slide').forEach((el, n) => el.classList.toggle('on', n === ui.slide));
  document.querySelectorAll('.cap').forEach((el, n) => { el.classList.toggle('on', n === ui.slide); el.setAttribute('aria-hidden', n === ui.slide ? 'false' : 'true'); });
  document.querySelectorAll('.dot').forEach((el, n) => {
    el.classList.remove('on', 'done');
    el.removeAttribute('aria-current');
    if (n < ui.slide) el.classList.add('done');
    if (n === ui.slide) { void el.offsetWidth; el.classList.add('on'); el.setAttribute('aria-current', 'true'); }
  });
}

// The progress bar of the active slide drives the autoplay: when it finishes, go to the next slide.
$('dots').addEventListener('animationend', e => { if (e.animationName === 'fill') goTo(ui.slide + 1); });
$('dots').addEventListener('click', e => { const b = e.target.closest('.dot'); if (b) goTo([...$('dots').children].indexOf(b)); });

// Scale the cards to the space available so the stack always fits.
function fitCards() {
  const viz = $('viz');
  if (!viz.offsetParent) return;
  const s = Math.min(viz.clientWidth / 566, viz.clientHeight / 360, 1.35);
  viz.style.setProperty('--s', Math.max(s, 0.45).toFixed(3));
}

/* ---------- Start ---------- */
document.querySelectorAll('.brand-name').forEach(el => { el.textContent = BRAND; });
$('eye').innerHTML = svg('eye', 20);
paintIcons();
buildCarousel();
fitCards();
goTo(0);
new ResizeObserver(fitCards).observe($('viz'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCards);
setMode(params.get('mode') === 'signup' ? 'signup' : 'signin');
if (window.matchMedia('(pointer: fine)').matches) $(ui.mode === 'signup' ? 'name' : 'email').focus();
</script>
